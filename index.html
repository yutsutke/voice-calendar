<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>声で入れるカレンダー（仮）</title>
<script>
// ⚠️ 最初に置くこと（層スクリプトより前）。iPhone にはコンソールが無く、Mac が無いので
// Safari Web Inspector も使えない＝**エラーを画面に出さないと永久に盲目**（1回の確認に
// Codemagic ビルド15分）。capture=true で <script> の読み込み失敗（resource error）も拾う。
// 診断は「診断される側」に依存しないこと: 本体（インラインスクリプト）が全滅しても
// この head の自己完結コードだけで画面に出る。
window.__vcErrors = [];
window.__vcNote = function (where, msg) {
  window.__vcErrors.push({ where: where, msg: String(msg) });
  if (window.__vcErrors.length > 30) window.__vcErrors.shift();
  if (window.__vcRenderDiag) window.__vcRenderDiag();
};
// 情報ログ（v15）: Swift 内部の出来事など。エラーではないので診断を自動で開かない
window.__vcDebugLog = [];
window.__vcDebugNote = function (msg) {
  var d = new Date();
  window.__vcDebugLog.push(('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) + ' ' + String(msg));
  if (window.__vcDebugLog.length > 40) window.__vcDebugLog.shift();
  if (window.__vcRenderDiag) window.__vcRenderDiag();
};
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'SCRIPT') window.__vcNote('script読込失敗', e.target.getAttribute('src') || '(inline)');
  else window.__vcNote('例外', (e.message || e.error) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno);
}, true);
window.addEventListener('unhandledrejection', function (e) {
  window.__vcNote('Promise拒否', (e.reason && e.reason.message) || e.reason);
});

window.__vcRenderDiag = function () {
  var list = document.getElementById('diagList');
  if (!list) return; // まだ DOM が来ていない
  var C = window.Capacitor;
  var native = !!(C && C.isNativePlatform && C.isNativePlatform());
  var rows = [];
  rows.push(['環境', native ? 'native (Capacitor)' : 'web ブラウザ']);
  rows.push(['音声エンジン', (window.__vcEngine || '(未初期化)') + (window.__vcNativeFailure ? ' ← native 失敗: ' + window.__vcNativeFailure : '')]);
  // 保存先（v23）: 入口（音声）と対になる出口。「保存できたのに見つからない」を切り分ける。
  // 併記の「識別子復元」は **write-only で calendar(withIdentifier:) が動くかの実測**＝
  // Apple のドキュメントに記述が無く、実機で1回見れば確定する（v22 の「起動Nms」と同じ手）。
  rows.push(['保存先', window.__vcCalTarget || '(未取得)']);
  var layers = ['VCSettings', 'VCStore', 'VCParser', 'VCTranscriber', 'VCAdapter']
    .map(function (n) { return (window[n] ? '✅' : '❌') + n; }).join(' ');
  rows.push(['層の読込', layers]);
  rows.push(['初期化', window.__vcInitDone ? '✅ 完了' : '❌ 途中で停止']);
  list.innerHTML = '';
  rows.forEach(function (r) {
    var d = document.createElement('div');
    d.className = 'h-item';
    d.textContent = r[0] + ': ' + r[1];
    list.appendChild(d);
  });
  window.__vcErrors.forEach(function (e) {
    var d = document.createElement('div');
    d.className = 'h-item h-note';
    d.textContent = '⚠ ' + e.where + ': ' + e.msg;
    list.appendChild(d);
  });
  // 情報ログ（音声エンジンの内部イベント等）。薄く表示・自動オープンの対象外
  window.__vcDebugLog.forEach(function (msg) {
    var d = document.createElement('div');
    d.className = 'h-item h-debug';
    d.textContent = msg;
    list.appendChild(d);
  });
  // エラーがある / 初期化が止まった なら自動で開く（黙って壊れない）
  var box = document.getElementById('diagBox');
  if (box && (window.__vcErrors.length || !window.__vcInitDone)) box.open = true;
};
document.addEventListener('DOMContentLoaded', function () { window.__vcRenderDiag(); });
</script>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --sub: #6e6e73;
    --line: #d2d2d7; --accent: #0a84ff; --accent-ink: #ffffff;
    --ok: #30a14e; --warn: #b25000; --lock: #ffd60a22; --flash: #0a84ff22;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --sub: #98989d; --line: #3a3a3c; --lock: #ffd60a1e; --flash: #0a84ff33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: calc(var(--sat) + 12px) 16px calc(var(--sab) + 24px);
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; text-align: center; margin: 4px 0 14px; }
  h1 .kari { font-weight: 400; color: var(--sub); font-size: 13px; }

  /* ---- 録音（入口B） ---- */
  .mic-wrap { text-align: center; margin-bottom: 6px; }
  #mic {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-size: 34px;
    box-shadow: 0 4px 14px rgb(10 132 255 / .35); transition: transform .1s;
  }
  #mic:active { transform: scale(.95); }
  #mic.listening { background: #ff375f; box-shadow: 0 0 0 8px rgb(255 55 95 / .18); animation: pulse 1.2s infinite; }
  #mic:disabled { background: var(--line); box-shadow: none; cursor: default; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 16px rgb(255 55 95 / .06); } }
  .mic-state { color: var(--sub); font-size: 13px; margin-top: 8px; min-height: 20px; }
  .transcript { min-height: 24px; text-align: center; color: var(--sub); font-size: 14px; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .transcript .final { color: var(--ink); }
  .notes { text-align: center; font-size: 12px; color: var(--warn); min-height: 18px; margin-bottom: 8px; }

  /* ---- 開発用: テキストで発話 ---- */
  .sim { display: flex; gap: 8px; margin-bottom: 18px; }
  .sim input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; background: var(--card); color: var(--ink); }
  .sim button { padding: 9px 14px; border: none; border-radius: 10px; background: var(--card); color: var(--accent); font-size: 14px; cursor: pointer; border: 1px solid var(--line); white-space: nowrap; }

  /* ---- フォーム（単一の真実の描画） ---- */
  form.card { background: var(--card); border-radius: 16px; padding: 6px 16px; box-shadow: 0 1px 3px rgb(0 0 0 / .06); }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); position: relative; }
  .row:last-child { border-bottom: none; }
  .row label.name { flex: 0 0 4.5em; font-size: 14px; color: var(--sub); }
  .row .req { color: var(--accent); font-size: 11px; margin-left: 2px; }
  .row input[type="text"], .row textarea { flex: 1; border: none; background: transparent; font-size: 16px; color: var(--ink); outline: none; min-width: 0; }
  .row input[type="date"], .row input[type="time"] { border: none; background: transparent; font-size: 16px; color: var(--ink); outline: none; font-family: inherit; }
  .row textarea { resize: vertical; min-height: 24px; }
  .row .lockmark { position: absolute; right: 0; top: 6px; font-size: 11px; color: var(--warn); opacity: 0; transition: opacity .15s; pointer-events: none; }
  .row.locked { background: var(--lock); border-radius: 8px; }
  .row.locked .lockmark { opacity: 1; }
  .row.flash { animation: flashbg 1.2s ease-out; }
  @keyframes flashbg { 0% { background: var(--flash); border-radius: 8px; } 100% { background: transparent; } }

  details.optional { margin-top: 10px; }
  details.optional > summary { list-style: none; cursor: pointer; color: var(--sub); font-size: 13px; padding: 6px 4px; user-select: none; }
  details.optional > summary::before { content: '▸ '; }
  details.optional[open] > summary::before { content: '▾ '; }
  details.optional .card2 { background: var(--card); border-radius: 16px; padding: 2px 16px; box-shadow: 0 1px 3px rgb(0 0 0 / .06); }

  /* ---- 来歴 ---- */
  .history-list { font-size: 13px; }
  .history-list .h-item { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .history-list .h-item:last-child { border-bottom: none; }
  .history-list .h-time { color: var(--sub); font-size: 11px; margin-right: 6px; }
  .history-list .h-text { color: var(--ink); overflow-wrap: anywhere; }
  .history-list .h-result { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .history-list .h-note { color: var(--warn); }
  .history-list .h-empty { color: var(--sub); padding: 10px 0; }
  .history-list .h-debug { color: var(--sub); font-size: 11px; padding: 3px 0; border-bottom: none; }
  .history-list .h-undo { margin-top: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--accent); font-size: 12px; cursor: pointer; font-family: inherit; }
  .history-list .h-undo:active { opacity: .6; }
  /* 発話の扱いモード（v21）: 🆕 新規 / 🎯 欄指定 が一目で分かる。
     色は 16進+アルファ（このファイルの既存流儀。color-mix は古い iOS Safari で効かない） */
  .history-list .h-badge { display: inline-block; margin: 4px 0 2px; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600; }
  .history-list .b-new { background: #0a84ff22; color: var(--accent); }
  .history-list .b-new-wiped { background: #ff950026; color: var(--warn); }
  .history-list .b-targeted { background: #30a14e22; color: var(--ok); }
  @media (prefers-color-scheme: dark) {
    /* 暗所では既定の --warn / --ok が沈むのでバッジの文字だけ明るくする */
    .history-list .b-new-wiped { color: #ff9f0a; }
    .history-list .b-targeted { color: #30d158; }
  }

  /* ---- 詳細設定 ---- */
  .set-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .set-item:last-child { border-bottom: none; }
  .set-head { display: flex; align-items: center; gap: 10px; }
  .set-head label { flex: 1; font-size: 14px; color: var(--ink); }
  .set-item .set-hint { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
  .set-item select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 14px;
    background: var(--card); color: var(--ink); font-family: inherit; }
  .set-item input[type="checkbox"] { width: 20px; height: 20px; }
  .set-native { font-size: 10px; color: var(--sub); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; margin-left: 6px; white-space: nowrap; }
  /* 保存先の現在地（v23→v26: 選択は撤去し「今どこへ入るか」の表示だけ残した） */
  .set-item .set-cur { font-size: 12px; color: var(--ink); margin-top: 6px; overflow-wrap: anywhere; }
  .set-item .set-cur.warn { color: var(--warn); }
  .history-actions { text-align: right; padding: 8px 0; }
  .history-actions button { border: none; background: transparent; color: var(--sub); font-size: 12px; cursor: pointer; }

  /* ---- 保存 ---- */
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  #save { flex: 1; padding: 14px; border: none; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; cursor: pointer; }
  #save:active { opacity: .85; }
  #clear { padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: transparent; color: var(--sub); font-size: 14px; cursor: pointer; }

  /* 権限が拒否されたときの復帰導線（v23）: iOS の権限ダイアログは初回の一度きり＝
     拒否されるとアプリからは二度と出せない。これが無いと「保存に失敗」と出るだけで詰む
     （あの日 v215 のカメラ権限の教訓「拒否が残ると回復導線がない」。Swift 側の openSettings は
      v11 から在ったのに、v22 まで JS が呼んでいないデッドコードだった） */
  .perm { display: none; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px;
    border: 1px solid var(--warn); border-radius: 12px; background: #ff950014; font-size: 13px; color: var(--ink); }
  .perm.show { display: flex; }
  .perm span { flex: 1; line-height: 1.45; }
  .perm button { border: 1px solid var(--warn); border-radius: 8px; padding: 7px 12px; background: transparent;
    color: var(--warn); font-size: 13px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .perm button:active { opacity: .6; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 20px); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px;
    opacity: 0; transition: all .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer { text-align: center; color: var(--sub); font-size: 11px; margin-top: 26px; }
</style>
</head>
<body>
<main>
  <h1>🎤 声で入れるカレンダー <span class="kari">（仮）</span></h1>

  <div class="mic-wrap">
    <button id="mic" type="button" aria-label="録音">🎤</button>
    <div class="mic-state" id="micState"></div>
  </div>
  <div class="transcript" id="transcript"></div>
  <div class="notes" id="notes"></div>

  <div class="sim">
    <input id="simText" type="text" placeholder="テキストで発話を試す（例: 明日15時に歯医者）" autocomplete="off">
    <button id="simSend" type="button">発話として送る</button>
  </div>

  <form class="card" id="form" autocomplete="off" onsubmit="return false">
    <div class="row" data-field="title">
      <label class="name" for="f-title">タイトル<span class="req">●</span></label>
      <input type="text" id="f-title" placeholder="なんの予定？">
      <span class="lockmark">✋ 編集中 — 音声は書き込みません</span>
    </div>
    <div class="row" data-field="startDate" data-field2="startTime">
      <label class="name">開始<span class="req">●</span></label>
      <input type="date" id="f-startDate" aria-label="開始日">
      <input type="time" id="f-startTime" aria-label="開始時刻">
      <span class="lockmark">✋ 編集中 — 音声は書き込みません</span>
    </div>
  </form>

  <details class="optional" id="optional">
    <summary>任意の項目（終了・終日・場所・メモ）</summary>
    <div class="card2">
      <div class="row" data-field="endDate" data-field2="endTime">
        <label class="name">終了</label>
        <input type="date" id="f-endDate" aria-label="終了日">
        <input type="time" id="f-endTime" aria-label="終了時刻">
        <span class="lockmark">✋ 編集中 — 音声は書き込みません</span>
      </div>
      <div class="row" data-field="allDay">
        <label class="name" for="f-allDay">終日</label>
        <input type="checkbox" id="f-allDay">
        <span class="lockmark">✋ 編集中</span>
      </div>
      <div class="row" data-field="location">
        <label class="name" for="f-location">場所</label>
        <input type="text" id="f-location" placeholder="どこで？">
        <span class="lockmark">✋ 編集中 — 音声は書き込みません</span>
      </div>
      <div class="row" data-field="note">
        <label class="name" for="f-note">メモ</label>
        <textarea id="f-note" rows="1" placeholder="自由メモ（スキーマ外の受け皿）"></textarea>
        <span class="lockmark">✋ 編集中 — 音声は書き込みません</span>
      </div>
    </div>
  </details>

  <div class="actions">
    <button id="save" type="button">カレンダーに保存</button>
    <button id="clear" type="button">クリア</button>
  </div>

  <!-- 権限の復帰導線（v23）: 拒否は初回ダイアログの一度きりで決まり、以後アプリからは聞けない。
       ここが無いと「保存に失敗」の toast が出て消えるだけ＝行き止まりになる -->
  <div class="perm" id="permBanner">
    <span id="permText">カレンダーへの追加が許可されていません。</span>
    <button id="permOpen" type="button">設定を開く</button>
  </div>

  <!-- 来歴（SPEC §5-①）: 音声の生テキストと解釈結果の記録。
       「言ったのに変な値が入った」の原因切り分け（認識か解釈か）はここを見る -->
  <details class="optional" id="historyBox">
    <summary>来歴（最近の発話と解釈）</summary>
    <div class="card2">
      <div id="historyList" class="history-list"></div>
      <div class="history-actions"><button id="historyClear" type="button">来歴を消す</button></div>
    </div>
  </details>

  <!-- 詳細設定（v19）: 実機FBで「人によって望む挙動が違う」と分かった決定だけを露出する。
       既定は全部これまでの実挙動＝触らない人の体験は変わらない -->
  <details class="optional" id="settingsBox">
    <summary>詳細設定</summary>
    <div class="card2">
      <div id="settingsList"></div>
      <div class="history-actions"><button id="settingsReset" type="button">既定に戻す</button></div>
    </div>
  </details>

  <!-- 診断（v13）: 実機（iPhone）にコンソールが無いので、環境・層の読込・エラーを画面に出す。
       エラーがあれば自動で開く＝黙って壊れない -->
  <details class="optional" id="diagBox">
    <summary>診断（環境・エラー）</summary>
    <div class="card2">
      <div id="diagList" class="history-list"></div>
    </div>
  </details>

  <footer id="build"></footer>
</main>
<div class="toast" id="toast"></div>

<!-- ?v= は BUILD と必ず同じ版にする（tests/version.test.js が強制）。
     理由: この版文字列は index.html にしかないが、ロジックは別ファイル＝別キャッシュ。
     付けないと「フッタは新しいのにパーサは古い」という嘘の状態が成立する（v9 で実際に踏んだ）。
     index.html が更新されれば src の URL も変わる → JS も必ず新しく取り直される。 -->
<script src="engine/settings.js?v=29"></script>
<script src="engine/schema.js?v=29"></script>
<script src="engine/parser.js?v=29"></script>
<script src="input/transcriber.js?v=29"></script>
<script src="adapters/calendar.js?v=29"></script>
<script>
'use strict';
const BUILD = 'v29：Siri に別名を登録 —「ヘイシリ ボイカレ開いて」で開く（＋カタカナ正式名も明示）｜v28：話し終わったら自動保存（設定・既定オフ）｜v27：日時を言わなければ「今」｜v24：開いた瞬間に録音 · 2026-07-17';
console.log('BUILD:', BUILD);
document.getElementById('build').textContent = BUILD;

// ===== 詳細設定（v19）=====
// engine は設定の保存先も UI も知らない＝述語で注入する（setLockSource と同じ流儀）
const settings = VCSettings.createSettings();

// ===== 共有状態（単一の真実） =====
const store = VCStore.createDraftStore();
store.setPolicySource((k) => settings.get(k));

// ===== 描画は1つ: store → フォーム =====
const FIELD_INPUT = {
  title: 'f-title', startDate: 'f-startDate', startTime: 'f-startTime',
  endDate: 'f-endDate', endTime: 'f-endTime', location: 'f-location', note: 'f-note', allDay: 'f-allDay',
};
const OPTIONAL_FIELDS = ['endDate', 'endTime', 'allDay', 'location', 'note'];
const inputEl = (f) => document.getElementById(FIELD_INPUT[f]);
const rowEl = (f) => document.querySelector(`.row[data-field="${f}"], .row[data-field2="${f}"]`);

// ロックの正 = 実際のフォーカス。render の「編集中はスキップ」と同じ根拠から導出することで、
// 「ロックは外れているのに描画はスキップ」＝ストアと画面がズレて画面と違う値が保存される事故を
// 構造的に防ぐ（v1 で踏んだ実バグ。詳細は engine/schema.js 冒頭）。
store.setLockSource((f) => inputEl(f) === document.activeElement);

function render(change) {
  const draft = store.get();
  syncLockMarks(); // 見た目のロック印も store.isLocked から導出＝実挙動と必ず一致
  for (const f of VCStore.FIELDS) {
    const el = inputEl(f);
    // 編集中の欄は描画で潰さない（caret が飛ぶ）。ロックと同じ根拠＝store.isLocked で判定するので、
    // 「スキップしたのにストアは書き換わっていた」というズレは起きない。
    if (store.isLocked(f)) continue;
    if (f === 'allDay') el.checked = draft.allDay;
    else if (el.value !== draft[f]) el.value = draft[f];
  }
  // 音声が書いた欄をフラッシュ（AI の結果が見える）
  if (change && change.type === 'voice') {
    for (const f of change.fields) {
      const row = rowEl(f);
      if (!row) continue;
      row.classList.remove('flash');
      void row.offsetWidth; // アニメ再発火
      row.classList.add('flash');
    }
    // 任意欄に書かれたら畳みを開く（見えないところに書かない）。設定で切れる＝
    // SPEC §12「フォームのプレッシャー」＝“見なくてよさ”がノールックの前提
    if (settings.get('autoOpenOptional') && change.fields.some((f) => OPTIONAL_FIELDS.includes(f))) {
      document.getElementById('optional').open = true;
    }
    if (change.skipped.length) {
      toast(`✋ 編集中の欄（${change.skipped.map(fieldLabel).join('・')}）はそのままにしました`);
    }
  }
}
store.subscribe(render);

function fieldLabel(f) {
  return { title: 'タイトル', startDate: '開始日', startTime: '開始時刻', endDate: '終了日', endTime: '終了時刻', location: '場所', note: 'メモ', allDay: '終日' }[f] || f;
}

// ===== 入口A: 人間の直接操作（focus=ロック / blur=解除） =====
// ロック状態は store.isLocked（=activeElement 由来）から描画する＝見た目と実挙動が必ず一致する
function syncLockMarks() {
  for (const row of document.querySelectorAll('.row')) {
    const pair = [row.dataset.field, row.dataset.field2].filter(Boolean);
    row.classList.toggle('locked', pair.some((f) => store.isLocked(f)));
  }
}
for (const f of VCStore.FIELDS) {
  const el = inputEl(f);
  el.addEventListener('focus', syncLockMarks);
  el.addEventListener('blur', syncLockMarks);
  el.addEventListener('input', () => {
    store.setByHuman(f, f === 'allDay' ? el.checked : el.value);
  });
}

// ===== 入口B: 音声 → 転写 → 解釈（純関数） → 構造化パッチ =====
const transcriptEl = document.getElementById('transcript');
const notesEl = document.getElementById('notes');
const micBtn = document.getElementById('mic');
const micState = document.getElementById('micState');

function onUtterance(text, meta) {
  transcriptEl.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'final';
  span.textContent = `🗣 ${text}`;
  transcriptEl.appendChild(span);
  // v14: 解釈〜反映で何が起きても **必ず来歴に痕跡を残す**。
  // 実機FBで「🗣 に見えているのに入らない」が出た＝途中で死ぬと無音になり、
  // native イベント経由の例外は window.onerror にも届かないことがある。
  // 🗣 表示は解釈の前なので「表示されるのに入らない」と症状が一致する。
  let patch = {}, notes = [], skipped = [], cleared = [], err = null, targeted = false;
  try {
    const r = VCParser.interpret(text, new Date());
    patch = r.patch;
    notes = r.notes;
    targeted = !!r.targeted; // 欄指定発話（「終了22時」等）= その欄だけの差分・掃除しない（v17）
    notesEl.textContent = notes.join(' ／ ');
    if (Object.keys(patch).length === 0) {
      // 何も解釈できない発話（咳・雑音など）ではフォームを触らない＝掃除もしない
      toast('解釈できる項目がありませんでした（フォームは手で入力できます）');
    } else {
      const a = store.applyVoicePatch(patch, text, { targeted });
      skipped = a.skipped;
      cleared = a.cleared;
    }
  } catch (e) {
    err = (e && e.message) || String(e);
    window.__vcNote('解釈エラー', `${err}｜発話「${text}」`);
    toast('解釈でエラーが起きました（詳細は「診断」と「来歴」）');
  }
  // 🔴 v20（実機FB）: 来歴に積むのは **この発話を適用した「後」の状態**。
  // v18 は「前」の状態を積んでいたため、行に「飲み会」と表示されているのに ↩ を押すと
  // 1つ前の「会議」に戻る＝行の表示と結果が食い違った（「反映されない」に見える）。
  // 行に見えている状態に戻るのが自然（ユーザーの言葉＝「この“タイトルに”戻す」）。
  // フォームを実際に変えた発話にだけ残す（変えていない発話の ↩ は直下の行と同じ状態＝冗長）。
  const changed = !err && (Object.keys(patch).length > 0) && (skipped.length !== Object.keys(patch).length || cleared.length > 0);
  // 🆕 この発話が「新規（言い直し）」として扱われたか（v21・実機FB「新規になったときに分かるように」）。
  // cleared では判定できない: 1件目の発話は新規でも消すものが無く cleared が空になる＝
  // **副作用ではなく「適用したモード」そのもの**を記録する。設定でオフなら新規扱いにならない。
  const isNew = !targeted && !!settings.get('plainUtteranceIsNew');
  logHistory({ at: Date.now(), text, conf: meta && meta.confidence, fb: !!(meta && meta.fallback), tg: targeted, nw: isNew, patch, notes, skipped, cleared, err, after: changed ? store.snapshot() : null });

  if (shouldAutoSave({ changed, targeted, notes, patch })) doSave({ auto: true });
}

/// 自動保存の条件（v28・実機FB「記録後、保存を自動にできる設定」）。
/// **SPEC §2-4「ノールックの条件＝曖昧さゼロで黙って1個に確定できる時だけ」をそのまま条件にする。**
/// 保存は不可逆（アプリに読み取り権限が無い＝入った予定はカレンダー側で手で消すしかない）＝
/// 迷ったら保存しない（人がフォームを見て押せばいい＝失うのは1タップだけ）。
function shouldAutoSave({ changed, targeted, notes, patch }) {
  if (!settings.get('autoSaveAfterUtterance')) return false; // 既定オフ
  if (!changed) return false;      // フォームが変わっていない＝空の予定を作らない
  if (targeted) return false;      // 欄指定は**まだ組み立て中**（「場所 立川」で保存したら場所だけの予定が入る）
  if (notes.length) return false;  // 解釈できなかった断片がある＝曖昧＝人に見せる（SPEC §7）
  // 🔴 **日時を言っていない発話は自動保存しない**（v28 の検証で見つけた穴）:
  // パーサは意味を判定しない＝「えーっと」もタイトルになり、v27 の「日時を言わなければ今」と
  // 組み合わさって**今の日時で確定してしまう**（実測: 「えーっと」が自動保存された）。
  // v24 の「開いた瞬間に録音」と重なると **アプリを開くだけで環境音が予定になる**＝致命的。
  // → **日時を明示した発話だけ**＝「明日15時に歯医者」「今 牛乳買う」は入る（日時を言う＝意図の表明）。
  //   「牛乳を買う」だけの発話はフォームに残る＝人が見て保存を押す（失うのは1タップ）。
  //   v27 の「今/現在」の語彙が、ここで**意図の表明**として効いている。
  if (!patch.startDate && !patch.startTime) return false;
  return true;
}

// ===== 来歴（SPEC §5-①）: 生テキスト＋解釈結果を端末内に記録（外部送信しない） =====
const HISTORY_KEY = 'vc_history_v1';
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
function logHistory(entry) {
  const h = loadHistory();
  h.unshift(entry);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 30))); } catch {}
  renderHistory();
}
function patchSummary(patch, skipped, cleared) {
  const parts = [];
  if ('title' in patch) parts.push(`タイトル「${patch.title}」`);
  if (patch.startDate || patch.startTime) parts.push(`開始 ${[patch.startDate, patch.startTime].filter(Boolean).join(' ')}`);
  if (patch.endDate || patch.endTime) parts.push(`終了 ${[patch.endDate, patch.endTime].filter(Boolean).join(' ')}`);
  if (patch.location) parts.push(`場所「${patch.location}」`);
  if (patch.note) parts.push(`メモ「${patch.note}」`);
  if (patch.allDay) parts.push('終日');
  let s = parts.length ? `→ ${parts.join('・')}` : '→ 解釈できる項目なし';
  if (skipped && skipped.length) s += `／✋スキップ: ${skipped.map(fieldLabel).join('・')}`;
  if (cleared && cleared.length) s += `／🧹 前回の${cleared.map(fieldLabel).join('・')}を空に`;
  return s;
}
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const h = loadHistory();
  if (!h.length) {
    const d = document.createElement('div');
    d.className = 'h-empty';
    d.textContent = 'まだ発話がありません';
    list.appendChild(d);
    return;
  }
  for (const e of h) {
    const item = document.createElement('div');
    item.className = 'h-item';
    const line1 = document.createElement('div');
    const time = document.createElement('span');
    time.className = 'h-time';
    const dt = new Date(e.at);
    time.textContent = `${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`
      + (typeof e.conf === 'number' ? ` 認識${Math.round(e.conf * 100)}%` : '')
      + (e.fb ? ' 補完確定' : ''); // isFinal が来ず途中結果で確定した発話（v15 の保険が効いた印）
    const text = document.createElement('span');
    text.className = 'h-text';
    text.textContent = `🗣 ${e.text}`;
    line1.append(time, text);
    const line2 = document.createElement('div');
    line2.className = 'h-result';
    line2.textContent = patchSummary(e.patch || {}, e.skipped, e.cleared);
    item.append(line1, line2);
    // モードのバッジ（v21）: この発話が「新規（前の入力を消して入れ直す）」だったか
    // 「欄指定（その欄だけ足す）」だったかを一目で。実機FB「新規になったときに分かるように」。
    // 消した実績のある新規は警告色＝“何を失ったか”が目で追える。
    if (e.nw || e.tg) {
      const wiped = !!(e.nw && e.cleared && e.cleared.length);
      const badge = document.createElement('div');
      badge.className = 'h-badge ' + (e.nw ? (wiped ? 'b-new-wiped' : 'b-new') : 'b-targeted');
      badge.textContent = e.nw ? (wiped ? '🆕 新規（前の入力を消した）' : '🆕 新規') : '🎯 欄指定';
      item.insertBefore(badge, line2); // 🗣 の下・解釈結果の上
    }
    if (e.notes && e.notes.length) {
      const n = document.createElement('div');
      n.className = 'h-result h-note';
      n.textContent = `⚠ ${e.notes.join(' ／ ')}`;
      item.appendChild(n);
    }
    if (e.err) {
      const n = document.createElement('div');
      n.className = 'h-result h-note';
      n.textContent = `🛑 解釈エラー: ${e.err}`;
      item.appendChild(n);
    }
    // ↩ この行に見えている状態に戻す（v20。v18 は「前」に戻していて行の表示と食い違った）
    if (e.after) {
      const undo = document.createElement('button');
      undo.type = 'button';
      undo.className = 'h-undo';
      undo.textContent = '↩ この状態に戻す';
      undo.addEventListener('click', () => restoreTo(e));
      item.appendChild(undo);
    }
    list.appendChild(item);
  }
}

// 来歴からの巻き戻し。フォーカスを外してから復元する＝ロック中の欄を描画がスキップして
// 「ストアと画面がズレる」事故（v3 で踏んだ）を防ぐ。人が押した以上は全欄を戻すのが正しい。
function restoreTo(entry) {
  if (!entry || !entry.after) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!store.restore(entry.after)) { toast('戻せませんでした'); return; }
  transcriptEl.textContent = '';
  notesEl.textContent = '';
  toast(`↩ 「${entry.text}」の状態に戻しました`);
}
document.getElementById('historyClear').addEventListener('click', () => {
  try { localStorage.removeItem(HISTORY_KEY); } catch {}
  renderHistory();
});
renderHistory();

const transcriber = VCTranscriber.createTranscriber({
  onInterim(t) { transcriptEl.textContent = `… ${t}`; },
  onFinal(t, meta) { onUtterance(t, meta); },
  onDebug(msg) { window.__vcDebugNote(`🎙 ${msg}`); }, // Swift 内部の出来事 → 診断（v15）
  onState(s) {
    micBtn.classList.toggle('listening', s === 'listening');
    micState.textContent = s === 'listening' ? '聞いています…（もう一度押すと停止）' : '';
  },
  onError(e) {
    if (e === 'no-speech') { micState.textContent = ''; return; } // web の「無言」は正常系
    toast(`音声認識エラー: ${e}`);
    window.__vcNote('音声', e); // toast は消える＝診断にも残す（v16）
  },
});

// 診断へ環境を報告（native を期待したのに web に落ちた理由もここに出る）
window.__vcEngine = transcriber.engine;
window.__vcNativeFailure = transcriber.nativeFailure || null;

if (transcriber.available) {
  // 無音の長さは押すたびに設定から読む（設定変更が次の発話から効く）
  micBtn.addEventListener('click', () => transcriber.toggle({ silenceMs: settings.get('silenceMs') }));
} else {
  micBtn.disabled = true;
  micState.textContent = transcriber.nativeFailure
    ? '音声認識が使えません（下のテキスト欄で入力できます）— 詳細は「診断」'
    : 'この環境では音声認識が使えません（下のテキスト欄で試せます）';
}

// ===== 起動＝即録音（v24・実機FB第16回の要求）=====
// 「アプリを開いた瞬間に、すぐに録音できるようにしたい」＝開く→話す（マイクをタップしない）。
// ノールックの入口であり、Phase 3（Siri 起動→即録音）の前提＝Siri は「開く」まで、ここが「即話せる」。
// - native のみ: web のマイクはユーザー操作なしに開けない（ブラウザの権限モデル）＝Pages は従来どおりタップ。
// - 書きかけがある時は録らない: 自動録音が拾った環境音は「発話=言い直し」(v6) で下書きを消し得る。
//   開いた人が話す前提で良いのは白紙の時だけ（手で直しに戻った時の巻き添えを防ぐ）。
// - 録音の 6 秒無音打ち切り（v11）が自動停止を保証＝開いて黙っていれば勝手に止まる。
// 実機の診断に 🎙「自動録音（起動/復帰）」が出る＝動いた証拠（v15: 画面に出す以外に見る手段が無い）。
function autoRecord(trigger) {
  if (transcriber.isListening()) return 'listening';       // toggle ではなく start＝既に聞いていたら触らない
  const d = store.get();
  if (VCStore.FIELDS.some((f) => d[f] !== '' && d[f] !== false)) return 'draft'; // 書きかけを守る
  if (transcriber.engine !== 'sfspeech') return `engine:${transcriber.engine}`;  // native の音声が生きている時だけ
  window.__vcDebugNote(`🎙 自動録音（${trigger}）`);
  transcriber.start({ silenceMs: settings.get('silenceMs') });
  return 'started';
}
window.__vcAutoRecord = autoRecord; // E2E がガードを検証する入口
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') autoRecord('復帰');
});
autoRecord('起動');

// テキストを発話として注入。**転写層に依存させない**（音声が壊れていても文字で入れられる＝
// フォームが本体・音声は補助。v13 の教訓）
const simText = document.getElementById('simText');
document.getElementById('simSend').addEventListener('click', send);
simText.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
function send() {
  const t = String(simText.value || '').trim();
  if (!t) return;
  simText.value = '';
  onUtterance(t, { engine: 'simulated' });
}

// ===== 詳細設定の描画 =====
function renderSettings() {
  const list = document.getElementById('settingsList');
  list.innerHTML = '';
  for (const d of settings.DEFS) {
    const item = document.createElement('div');
    item.className = 'set-item';
    const head = document.createElement('div');
    head.className = 'set-head';
    const label = document.createElement('label');
    label.setAttribute('for', `set-${d.key}`);
    label.textContent = d.label;
    if (d.native) {
      // web（Pages）では効かない設定＝native の音声プラグインに渡す値だと明示する
      const tag = document.createElement('span');
      tag.className = 'set-native';
      tag.textContent = 'アプリのみ';
      label.append(' ', tag);
    }
    let input;
    if (d.type === 'number') {
      input = document.createElement('select');
      for (const opt of d.options) {
        const o = document.createElement('option');
        o.value = String(opt);
        o.textContent = d.fmt ? d.fmt(opt) : String(opt);
        if (settings.get(d.key) === opt) o.selected = true;
        input.appendChild(o);
      }
      input.addEventListener('change', () => settings.set(d.key, Number(input.value)));
    } else {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!settings.get(d.key);
      input.addEventListener('change', () => settings.set(d.key, input.checked));
    }
    input.id = `set-${d.key}`;
    head.append(label, input);
    const hint = document.createElement('div');
    hint.className = 'set-hint';
    hint.textContent = d.hint;
    item.append(head, hint);
    list.appendChild(item);
  }

  // 保存先＝**設定ではなく事実**（v26 で選択を撤去）。それでも「今どこへ入るか」は見せる:
  // OS の既定が iCloud か Google かで行き先が変わり、見えないと「保存できたのに見つからない」の
  // 原因に辿り着けない（v23 の要求「見れたり」はここで生きている）。変える道は OS 設定への案内。
  const info = document.createElement('div');
  info.className = 'set-item';
  const ihead = document.createElement('div');
  ihead.className = 'set-head';
  const ilabel = document.createElement('label');
  ilabel.textContent = '保存先';
  const itag = document.createElement('span');
  itag.className = 'set-native';
  itag.textContent = 'アプリのみ';
  ilabel.append(' ', itag);
  ihead.append(ilabel);
  const ihint = document.createElement('div');
  ihint.className = 'set-hint';
  ihint.textContent = '変えるには iOS の「設定 → アプリ → カレンダー → デフォルトカレンダー」。Google に入れたい時は、先に設定でカレンダーのアカウントに Google を追加して、それを既定にする（アプリは Google と直接通信せず、OS が同期する）。';
  const cur = document.createElement('div');
  cur.className = 'set-cur';
  cur.id = 'cur-calendarTarget';
  cur.textContent = '確認中…';
  info.append(ihead, ihint, cur);
  list.appendChild(info);

  refreshCalendarTarget();
}
// ===== 保存先カレンダー（v23）＋ 権限の復帰導線 =====
// 「どこに書き出すか」が見えないと、保存できたのに見つからない事故の原因が分からない
// （OS の既定が iCloud か Google かは人によって違う）。SPEC §1-6: アプリは Google と直接通信せず、
// OS の既定カレンダーに書けば OS が同期する＝その証明が画面に出る。

/// 権限が拒否されている告知。**toast で流さずバナーで残す**＝拒否後はアプリからダイアログを
/// 出せない＝流れて消えると行き止まりになる（あの日 v215 のカメラ権限の教訓）。
function permBanner(show, msg) {
  const el = document.getElementById('permBanner');
  if (!el) return;
  if (msg) document.getElementById('permText').textContent = msg;
  el.classList.toggle('show', !!show);
}

document.getElementById('permOpen').addEventListener('click', async () => {
  const adapter = VCAdapter.pickAdapter();
  if (typeof adapter.openSettings !== 'function') { toast('この画面（web）では設定を開けません'); return; }
  try { await adapter.openSettings(); } catch (err) { toast(`設定を開けませんでした: ${(err && err.message) || err}`); }
});

// 拒否は Swift の reject 第2引数 'PERMISSION_DENIED' で来る
function handleCalendarError(err, prefix) {
  const code = err && (err.code || err.errorCode);
  if (code === 'PERMISSION_DENIED') {
    permBanner(true, 'カレンダーへの追加が許可されていません。「設定を開く」→ カレンダー を許可してください。');
    return;
  }
  toast(`${prefix}: ${(err && err.message) || err}`);
}

/// 今どこへ入るかを表示する（権限は要求しない＝設定を開いただけでダイアログを出さない）。
async function refreshCalendarTarget() {
  const el = document.getElementById('cur-calendarTarget');
  const adapter = VCAdapter.pickAdapter();
  const show = (cls, text) => { if (el) { el.className = cls; el.textContent = text; } };

  if (typeof adapter.getTarget !== 'function') {
    window.__vcCalTarget = 'web（.ics をダウンロード）';
    show('set-cur', 'この画面（web）では .ics ファイルを落とします。カレンダーに直接入るのはアプリだけです。');
    window.__vcRenderDiag();
    return;
  }
  try {
    const t = await adapter.getTarget();
    if (!t.authorized) {
      window.__vcCalTarget = '(未許可＝保存時に確認)';
      show('set-cur', 'まだカレンダーの許可がありません。保存するときに確認します。');
    } else if (!t.found) {
      window.__vcCalTarget = '❌ 見つからない';
      show('set-cur warn', `⚠ ${t.warning || '書き込み先のカレンダーが見つかりません（OS のカレンダー設定を確認）'}`);
    } else {
      const who = t.source ? `${t.title}（${t.source}）` : t.title;
      window.__vcCalTarget = `${who}｜${t.sourceType}`;
      show('set-cur', `${who} — OS の既定カレンダー`);
    }
  } catch (err) {
    // 取れないこと自体を表に出す（黙って空欄にしない＝v16）
    window.__vcCalTarget = `エラー: ${(err && err.message) || err}`;
    show('set-cur warn', `⚠ 保存先を確認できません: ${(err && err.message) || err}`);
  }
  window.__vcRenderDiag();
}

document.getElementById('settingsReset').addEventListener('click', () => {
  settings.resetAll();
  renderSettings();
  toast('詳細設定を既定に戻しました');
});
renderSettings();

// ===== 保存: DraftEvent → アダプタ =====
// opts.auto: 発話からの自動保存（v28）。**黙って保存しない**＝toast で「自動保存した」と告げる
// （v16「黙って捨てない」の保存版。保存は不可逆＝入ったことが分からないのが一番困る）。
async function doSave(opts) {
  const auto = !!(opts && opts.auto);
  const res = VCAdapter.materialize(store.get(), new Date(), { defaultDurationMin: settings.get('defaultDurationMin') });
  if (!res.ok) { toast(`⚠ ${res.problems.join(' / ')}`); return; }
  const adapter = VCAdapter.pickAdapter();
  try {
    const saved = (await adapter.save(res.event)) || {};
    permBanner(false);
    // toast は1つしか出せない＝1行にまとめる。**どこに入れたか**を必ず出す（v23）＝
    // 「保存できたのに見つからない」（既定が iCloud か Google かで行き先が変わる）を防ぐ
    let msg = auto ? '✅ 自動保存しました' : '✅ 保存しました';
    if (saved.calendarTitle) msg += ` → ${saved.calendarTitle}`;
    else if (adapter.name === 'ics') msg += '（.ics をダウンロード）';
    if (res.warnings.length) msg += `（${res.warnings.join('・')}）`;
    toast(msg);
    store.reset();
    transcriptEl.textContent = '';
    notesEl.textContent = '';
    document.getElementById('optional').open = false;
    refreshCalendarTarget(); // 初回保存で権限が付いた直後＝ここで初めて保存先が判明する
  } catch (err) {
    handleCalendarError(err, auto ? '自動保存に失敗' : '保存に失敗');
  }
}
document.getElementById('save').addEventListener('click', () => doSave());

document.getElementById('clear').addEventListener('click', () => {
  store.reset();
  transcriptEl.textContent = '';
  notesEl.textContent = '';
  document.getElementById('optional').open = false;
});

// ===== toast =====
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

// 初期化がここまで通った印。ここに到達しないと診断が「初期化: ❌ 途中で停止」を出す＝
// 実機でも「どこまで生きているか」が一目で分かる（v13 の教訓: 黙って壊れない）
window.__vcInitDone = true;
window.__vcRenderDiag();
</script>
